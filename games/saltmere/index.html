<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saltmere: The Drowning Bell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a moody, cute island mystery; quiet dread, small warm lights
   IDEA: an investigator's casebook pinned beside a pixel sea chart
   PICTURE: the island map, tide rising day by day, lighthouse beam at night
   COLOUR and TYPE: deep sea-teal, sea-glass ink, coral lighthouse accent; Pixelify Sans + Nunito
   LAYOUT: map + place panel on top, casebook tabs below; stacks under 900px */
:root{color-scheme:dark;--bg:#0c3237;--panel:#124248;--panel2:#0f3a40;--line:#2a6168;--ink:#e6f2ec;--muted:#9fc3bb;--coral:#ff6b5a;--gold:#ffd166;--good:#8fe3a8;--bad:#ff8a7a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.px{font-family:"Pixelify Sans",Nunito,sans-serif;font-weight:700;letter-spacing:.01em}
h1{font-size:clamp(26px,4vw,40px);line-height:1.05;margin:0}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:17px;margin:0 0 4px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:14px max(3vw,12px) 40px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-bottom:12px}
.hud{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip b{font-family:"Pixelify Sans";font-size:16px}
.slots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.slots i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.slots i.on{background:var(--gold)}
.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px}
@media(max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#0a2a2f;aspect-ratio:320/200}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.pin{position:absolute;transform:translate(-50%,4px);background:rgba(8,32,36,.82);border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:12px;line-height:1.3;white-space:nowrap;min-height:22px}
.pin:hover,.pin:focus-visible{border-color:var(--gold);outline:none}
.pin.cur{background:var(--coral);border-color:var(--coral);color:#fff;font-weight:800}
.pin:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:560px){.pin{font-size:10px;padding:1px 4px;min-height:18px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.place .desc{color:var(--muted);font-size:15px;margin:0 0 10px}
.acts{display:flex;flex-direction:column;gap:7px}
.act{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
.act:hover:not(:disabled),.act:focus-visible{border-color:var(--gold);outline:none}
.act:disabled{opacity:.45;cursor:not-allowed}
.act small{margin-left:auto;color:var(--muted);white-space:nowrap;font-size:13px}
.act canvas{width:32px;height:32px;image-rendering:pixelated;border-radius:6px;flex:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 10px}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;min-height:40px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card p{margin:4px 0}
.badge{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;background:var(--line)}
.b-journal{background:#e9d6a8;color:#3a2a10}.b-evidence{background:#7bdff2;color:#06303a}.b-testimony{background:#c79bff;color:#2a0f45}.b-rumour{background:#ffd166;color:#3a2a00}.b-find{background:#b8f28c;color:#173300}
.meta{color:var(--muted);font-size:13px}
.claimln{border-left:3px solid var(--gold);padding-left:8px;margin-top:6px;font-weight:600}
.ver{font-size:13px;font-weight:800;margin-top:6px}
.ver.t{color:var(--good)}.ver.f{color:var(--bad)}.ver.u{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filters button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;min-height:34px}
.filters button.on{border-color:var(--gold);color:var(--gold)}
.sus{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:start}
.sus canvas{width:56px;height:56px;image-rendering:pixelated;border-radius:8px}
.marks{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.marks button{font-size:12px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:3px 8px;min-height:30px}
.marks button.on{background:var(--gold);color:#2a2000;border-color:var(--gold);font-weight:800}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
td.c,th.c{text-align:center}
.scroll{overflow-x:auto}
textarea{width:100%;min-height:200px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px/1.5 Nunito,sans-serif}
.log p{margin:3px 0;font-size:14px}.log .d{color:var(--gold);font-family:"Pixelify Sans";margin-top:10px}
#modal{position:fixed;inset:0;background:rgba(3,16,18,.72);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
#modal[hidden]{display:none}
#mbox{background:var(--panel);border:2px solid var(--line);border-radius:16px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.dlg{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:start}
.dlg canvas{width:72px;height:72px;image-rendering:pixelated;border-radius:10px}
.dlg .who{font-family:"Pixelify Sans";color:var(--gold);font-size:18px}
.dlg .txt{font-size:17px;margin-top:2px}
.letter{background:#efe3c4;color:#2c2414;border-radius:8px;padding:14px 16px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:flex-end}
.btn{background:var(--coral);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:800;min-height:44px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pzgrid{display:grid;gap:4px;margin:12px auto;width:fit-content}
.lamp{width:46px;height:46px;border-radius:10px;border:2px solid var(--line);background:#0a2328}
.lamp.on{background:radial-gradient(circle at 50% 45%,#fff3c4,#ffd166 45%,#c98a1c);border-color:#ffd166;box-shadow:0 0 12px #ffd16688}
.peg{width:40px;height:40px;border-radius:50%;border:2px solid #0006;font-size:18px;display:inline-flex;align-items:center;justify-content:center;color:#1a1a1a;font-weight:800}
.lockrow{display:flex;gap:6px;align-items:center;justify-content:center;margin:5px 0}
.fb{font-size:14px;min-width:90px;color:var(--muted)}
.tile{width:68px;height:68px;border-radius:8px;border:2px solid var(--line);font-family:"Pixelify Sans";font-size:24px;background:var(--panel2)}
.tile.e{visibility:hidden}
.cipher{font-family:"Pixelify Sans";font-size:19px;line-height:1.5;background:var(--panel2);border-radius:10px;padding:12px;word-break:break-word}
.dial{display:flex;align-items:center;gap:8px;justify-content:center;margin:8px 0}
.dial button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:20px}
.dial b{font-family:"Pixelify Sans";font-size:22px;min-width:40px;text-align:center}
select{font:16px Nunito,sans-serif;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-height:44px}
label.f{display:block;margin:10px 0 4px;font-weight:800}
.tide{display:inline-block;width:60px;height:9px;border-radius:5px;background:var(--line);overflow:hidden;vertical-align:middle;margin-left:6px}
.tide i{display:block;height:100%;background:#7bdff2}
.heat0{color:var(--good)}.heat1{color:var(--gold)}.heat2{color:#ffa36b}.heat3{color:var(--bad)}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Saltmere: The Drowning Bell</h1>
      <p class="sub">Find the thief, the lookout and the hiding place before the fourteenth tide.</p>
    </div>
    <div class="hud" id="hud"></div>
  </header>
  <div class="main">
    <div class="mapbox" id="mapbox"><canvas id="map" width="320" height="200"></canvas></div>
    <section class="panel place" id="place"></section>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <section id="tabbody"></section>
</div>
<div id="modal" hidden><div id="mbox" role="dialog" aria-modal="true"></div></div>

<script>
{
/* ---------- data ---------- */
const PLACES={
 lighthouse:{n:"The Lighthouse",x:46,y:50,d:"Uncle Aldous's tower on its rock. The brass cradle in the lens room sits empty."},
 apothecary:{n:"Apothecary",x:108,y:92,d:"Jars of kelp tincture and sleeping draughts. Shuttered at night."},
 square:{n:"Market Square",x:178,y:86,d:"Stalls, the old well, and Kit perched on its rim."},
 chapel:{n:"St. Brine Chapel",x:224,y:46,d:"The bell tower above, the crypt below. The tide-bell hums on its own."},
 manor:{n:"Marrow Manor",x:276,y:84,d:"Peeling grandeur on the east hill. The wine cellar runs deep."},
 tavern:{n:"The Gull & Lantern",x:152,y:126,d:"Warm, loud, and full of loose tongues after dark."},
 archive:{n:"The Archive",x:214,y:126,d:"Every deed, tide table and lie ever written in Saltmere. Shut at night."},
 harbour:{n:"Harbour",x:118,y:160,d:"Creaking jetties. Hale's chandlery sells lamp oil."},
 cemetery:{n:"Cliff Cemetery",x:262,y:154,d:"Salt-bitten headstones and the Marrow family tomb."},
 cove:{n:"Smugglers' Cove",x:60,y:148,d:"Sea caves gape at low water. The wreck of the Grey Maiden rots on the sand."}
};
const NPC={
 ysolde:{name:"Mother Ysolde",short:"Mother Ysolde",role:"Chaplain of St. Brine",home:"chapel",look:{skin:"#f0cfae",hair:"#e8e8e8",style:"veil",cloth:"#2b2f3a"},intro:"Your uncle rang our bell three times the night before he vanished. Aldous never rang it. Not once in thirty years."},
 hale:{name:"Captain Brannoch Hale",short:"Captain Hale",role:"Harbourmaster",home:"harbour",look:{skin:"#d9a27a",hair:"#777",style:"cap",hat:"#1f3b5a",cloth:"#24455e",beard:1},intro:"Tides are my business, and they're wrong. Higher every morning, and no moon to blame."},
 wenna:{name:"Wenna Pike",short:"Wenna",role:"Keeper of the Gull & Lantern",home:"tavern",look:{skin:"#f4c9a8",hair:"#d9542b",style:"bun",cloth:"#6b3a2a"},intro:"First drink's free for Aldous's kin. The second you pay for in stories."},
 crane:{name:"Dr. Silas Crane",short:"Dr. Crane",role:"Apothecary",home:"apothecary",look:{skin:"#e9c39f",hair:"#222",style:"short",cloth:"#3b4a3f",glasses:1},intro:"Fear is a fever, and this town has it badly. I can sell you something for the nerves."},
 ophelia:{name:"Lady Ophelia Marrow",short:"Lady Marrow",role:"Heir of Marrow Manor",home:"manor",look:{skin:"#f6d8c2",hair:"#3a2340",style:"tall",cloth:"#7b3f8c"},intro:"The Marrows built that lighthouse. Whatever was stolen from it was ours first."},
 tobin:{name:"Tobin Reyes",short:"Tobin",role:"Gravedigger",home:"cemetery",look:{skin:"#b9825a",hair:"#4a3222",style:"cap",hat:"#5a4a2a",cloth:"#4a4a32",beard:1},intro:"Graves keep filling with seawater. Never used to. The dead don't like it."},
 edda:{name:"Edda Quill",short:"Edda",role:"Archivist",home:"archive",look:{skin:"#efd2b8",hair:"#9a9a9a",style:"bun",cloth:"#3a3a5a",glasses:1},intro:"Every record of the Tidestone is in this room. Most of them are lies. I keep them anyway."}
};
const KIT={name:"Kit",look:{skin:"#e8b890",hair:"#a0522d",style:"messy",cloth:"#5a6a3a"}};
const ALDOUS={name:"Uncle Aldous",look:{skin:"#e6c09a",hair:"#ddd",style:"short",cloth:"#7a2a24",beard:1,glasses:1}};
const BARN={name:"Barnacle",look:{cat:1}};
const IDS=Object.keys(NPC);
const SITES={
 tower:{n:"Chapel bell tower",the:"chapel bell tower",place:"chapel",below:0,wet:0,holy:1,town:1},
 crypt:{n:"Chapel crypt",the:"chapel crypt",place:"chapel",below:1,wet:0,holy:1,town:1},
 caves:{n:"Sea caves",the:"sea caves",place:"cove",below:1,wet:1,holy:0,town:0},
 wreck:{n:"Wreck of the Grey Maiden",the:"wreck of the Grey Maiden",place:"cove",below:0,wet:1,holy:0,town:0},
 well:{n:"Old well",the:"old well",place:"square",below:1,wet:1,holy:0,town:1},
 cellar:{n:"Manor wine cellar",the:"manor wine cellar",place:"manor",below:1,wet:0,holy:0,town:1},
 tomb:{n:"Marrow family tomb",the:"Marrow family tomb",place:"cemetery",below:0,wet:0,holy:1,town:0}
};
const SIDS=Object.keys(SITES);
const CATS={hand:["left-handed","right-handed"],habit:["pipe smoker","snuff taker","licorice chewer"],boots:["hobnail boots","sea boots","soft shoes"],stain:["ink-stained fingers","wax-stained fingers","earth-stained fingers","salt-crusted fingers"]};
const CATL={hand:"Hand",habit:"Habit",boots:"Footwear",stain:"Fingers"};
const TP={hand:["is left-handed","is right-handed"],habit:["smokes a pipe","takes snuff","chews licorice"],boots:["wears hobnail boots","wears sea boots","wears soft shoes"],stain:["has ink-stained fingers","has wax-stained fingers","has earth-stained fingers","has salt-crusted fingers"]};
const SP={below:["The stone is hidden above ground, open to the sky.","The stone is hidden below ground."],wet:["The hiding place is dry.","The hiding place is wet."],holy:["The stone is not on holy ground.","The stone lies on holy ground."],town:["The stone was carried out of town, into the wild.","The stone never left the town."]};
const FL={
 cT:{hand:["Pry marks on the cradle lock lean leftward.","Pry marks on the cradle lock lean rightward."],habit:["Pipe ash on the lens-room stair.","Spilled snuff beside the empty cradle.","A chewed licorice root under the cradle."],boots:["Hobnail scratches across the lantern-room boards.","Broad sea-boot prints in the lamp soot.","Only faint soft-shoe scuffs in the soot."],stain:["An inky thumbprint on the cradle brass.","A waxy thumbprint on the cradle brass.","An earthy thumbprint on the cradle brass.","A salt-crusted thumbprint on the cradle brass."]},
 aT:{boots:["Hobnail scratches on the doorstep, where someone waited.","Deep sea-boot prints by the door, where someone stood a long while.","Soft-shoe prints pacing by the door."],habit:["A little heap of pipe ash by the door, where someone kept watch.","Spilled snuff on the step where someone kept watch.","Chewed licorice by the door, where someone kept watch."],stain:["An inky smear on the door rail, where the lookout leaned.","A drip of wax on the door rail, where the lookout leaned.","An earthy handprint on the door rail, where the lookout leaned.","Salt crust on the door rail, where the lookout leaned."]},
 sP:{below:["Gull down caught in the stone's wrapping cloth.","The wrapping cloth smells of deep, still, underground air."],wet:["The wrapping cloth is bone dry and dusty.","Salt water has dried in rings on the wrapping cloth."],holy:["A rough note: \"Not on holy ground. It won't abide it.\"","Drips of blessed beeswax on the wrapping cloth."],town:["Heather burrs caught in the handcart that moved it.","Cobble grit in the handcart that moved it."]}
};
const SECRETS={
 ysolde:"A pawn ticket: Mother Ysolde sold the chapel's silver chalice last month, quietly.",
 hale:"A manifest with no names on it. Captain Hale lands untaxed brandy by night.",
 wenna:"An IOU in Wenna's hand: she owes Lady Marrow forty crowns, long overdue.",
 crane:"Dr. Crane's ledger: large sleeping draughts, sold weekly to someone at the manor.",
 ophelia:"A bank letter: Marrow Manor is mortgaged to the roof, and the bank wants it by spring.",
 tobin:"A gold ring in a twist of cloth, grave-dirt still on it. Tobin has been robbing the dead.",
 edda:"Two copies of the same deed, one forged. Edda has been quietly altering the town records."
};
const NOTHING=["Old nets, a dead crab, and nothing else.","A child's drawing of the lighthouse. Sweet, and useless.","Dust, mouse droppings, and a button.","A love letter, unsigned and decades old. It tells you nothing.","An empty bottle with a cork that says 'LUCK'. It isn't."];
const PZ={lock:"a locked sea-chest",lamps:"a lantern panel",mirror:"a mirror-lock set in the stone",slide:"a torn chart in a frame",cipher:"a letter written in cipher"};
const SLOTS=["Dawn","Noon","Dusk","Night"];
const PREF=["I'll tell you plain:","Mark this:","Between us,","Swear on the tide:","I saw enough to say this:","For what it's worth,"];

/* ---------- rng ---------- */
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=n=>Math.floor(R()*n), pick=a=>a[ri(a.length)];
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const N=x=>NPC[x].short;

/* ---------- logic ---------- */
let T={};
function ev(p,w){switch(p.t){
 case"notC":return w.c!==p.x;case"notA":return w.a!==p.x;
 case"inno":return w.c!==p.x&&w.a!==p.x;case"inv":return w.c===p.x||w.a===p.x;
 case"cT":return T[w.c][p.cat]===p.v;case"aT":return T[w.a][p.cat]===p.v;
 case"sP":return SITES[w.h][p.k]===p.v;case"nS":return w.h!==p.s}}
function allProps(){const P=[];
 IDS.forEach(x=>P.push({t:"notC",x},{t:"notA",x},{t:"inno",x},{t:"inv",x}));
 for(const c in CATS)CATS[c].forEach((_,v)=>P.push({t:"cT",cat:c,v}));
 ["boots","habit","stain"].forEach(c=>CATS[c].forEach((_,v)=>P.push({t:"aT",cat:c,v})));
 ["below","wet","holy","town"].forEach(k=>[0,1].forEach(v=>P.push({t:"sP",k,v})));
 SIDS.forEach(s=>P.push({t:"nS",s}));return P}
const WORLDS=[];IDS.forEach(c=>IDS.forEach(a=>{if(a!==c)SIDS.forEach(h=>WORLDS.push({c,a,h}))}));
const pkey=p=>JSON.stringify(p);
function claim(p,spk){const me=p.x&&p.x===spk;switch(p.t){
 case"notC":return me?"I never laid a finger on the Tidestone.":`${N(p.x)} did not take the Tidestone.`;
 case"notA":return me?"I kept watch for nobody.":`${N(p.x)} was not the lookout.`;
 case"inno":return me?"I had no part in it.":`${N(p.x)} had no part in the theft.`;
 case"inv":return `${N(p.x)} had a hand in the theft.`;
 case"cT":return `The thief ${TP[p.cat][p.v]}.`;case"aT":return `The lookout ${TP[p.cat][p.v]}.`;
 case"sP":return SP[p.k][p.v];case"nS":return `The stone is not in the ${SITES[p.s].the}.`}}
function flav(p){switch(p.t){
 case"cT":return FL.cT[p.cat][p.v];case"aT":return FL.aT[p.cat][p.v];case"sP":return FL.sP[p.k][p.v];
 case"nS":return `A scrawled list of hiding places, one struck through: "${SITES[p.s].n}: too watched."`;
 case"notC":return `A signed docket puts ${N(p.x)} across town at the very hour of the theft.`;
 case"notA":return `A lamplighter's note: ${N(p.x)}'s window was lit till dawn, and nobody left it.`;
 case"inno":return `A ferry stub: ${N(p.x)} was on the mainland the night of the theft.`;
 case"inv":return `A scrap in ${N(p.x)}'s hand: the lighthouse watch times, carefully copied.`}}

/* ---------- world generation ---------- */
let G=null;
function gen(seed){
 for(let tryN=0;tryN<400;tryN++){
  R=mul(seed*7919+tryN*104729);
  const r=tryGen();
  if(r){R=Math.random;return r}
 }
 R=Math.random;return null;
}
function tryGen(){
 const c=pick(IDS),a=pick(IDS.filter(x=>x!==c)),h=pick(SIDS),W={c,a,h};
 T={};IDS.forEach(id=>{T[id]={};for(const k in CATS)T[id][k]=ri(CATS[k].length)});
 const P=allProps(),truP=P.filter(p=>ev(p,W)),falP=P.filter(p=>!ev(p,W));
 let cand=WORLDS.slice();const need=[];
 for(const p of shuf(truP.filter(p=>p.t!=="inv"&&p.t!=="inno"))){
  const nw=cand.filter(w=>ev(p,w));if(nw.length<cand.length){need.push(p);cand=nw}if(cand.length===1)break}
 if(cand.length!==1||need.length<8||need.length>15)return null;
 const used=new Set(need.map(pkey));
 const items={};let nid=0;const mk=o=>{o.id="i"+(nid++);items[o.id]=o;return o.id};
 const ns=shuf(need);
 const journal=ns.splice(0,3).map(p=>mk({kind:"journal",prop:p,truth:true}));
 const inn=IDS.filter(x=>x!==c&&x!==a);
 const testi={};IDS.forEach(x=>testi[x]=[]);
 const evid=[],rum=[];
 ns.forEach((p,i)=>{
  const r=R();

function pLock(b,head,done){
 const COL=["#ff6b5a","#ffd166","#7bdff2","#b8f28c","#c79bff","#f4f1de"],GL=["▲","■","●","◆","✚","★"];
 const code=[0,1,2,3].map(()=>Math.floor(Math.random()*6));let g=[0,0,0,0];const hist=[];
 const draw=()=>{b.innerHTML=head+`<p>Four dials, six symbols, eight tries. ● means right symbol in the right place, ○ means right symbol in the wrong place. Symbols can repeat.</p>
 ${hist.map(h=>`<div class="lockrow">${h.g.map(v=>`<span class="peg" style="background:${COL[v]}">${GL[v]}</span>`).join("")}<span class="fb">${"●".repeat(h.e)}${"○".repeat(h.m)}${!h.e&&!h.m?"nothing":""}</span></div>`).join("")}
 <div class="lockrow">${g.map((v,i)=>`<button class="peg" data-i="${i}" style="background:${COL[v]}" aria-label="Dial ${i+1}">${GL[v]}</button>`).join("")}<span class="fb">${8-hist.length} left</span></div>
 <div class="row" style="justify-content:center"><button class="btn" id="try">Try this</button></div>`;
  b.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>{g[+x.dataset.i]=(g[+x.dataset.i]+1)%6;draw()});
  b.querySelector("#try").onclick=()=>{let e=0,m=0;const cc=[0,0,0,0,0,0],gc=[0,0,0,0,0,0];g.forEach((v,i)=>{if(v===code[i])e++;else{cc[code[i]]++;gc[v]++}});for(let k=0;k<6;k++)m+=Math.min(cc[k],gc[k]);hist.push({g:g.slice(),e,m});if(e===4)return done(true);if(hist.length>=8)return done(false);draw()};
  quitRow(b,done)};draw()}
function pLamps(b,head,done){
 const n=5,s=Array(25).fill(1);const tog=i=>{const r=Math.floor(i/n),c=i%n;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const R2=r+dr,C2=c+dc;if(R2>=0&&R2<n&&C2>=0&&C2<n)s[R2*n+C2]^=1})};
 const pres=new Set();while(pres.size<7)pres.add(Math.floor(Math.random()*25));pres.forEach(tog);let mv=0;
 const draw=()=>{b.innerHTML=head+`<p>Light every lantern. Each one you touch flips itself and its four neighbours. Moves: ${mv}</p><div class="pzgrid" style="grid-template-columns:repeat(5,46px)">${s.map((v,i)=>`<button class="lamp ${v?"on":""}" data-i="${i}" aria-label="Lantern ${i+1} ${v?"lit":"dark"}"></button>`).join("")}</div>`;
  b.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>{tog(+x.dataset.i);mv++;if(s.every(v=>v))return done(true);draw()});quitRow(b,done)};draw()}
function pMirror(b,head,done){
 const n=7;const D=[[0,1],[1,0],[0,-1],[-1,0]];// E S W N
 const refl=(m,d)=>m==="/"?[3,2,1,0][d]:[1,0,3,2][d];
 let grid,target,r0;
 const trace=()=>{let r=r0,c=-1,d=0;const pts=[[r,c]];const seen=new Set();for(let k=0;k<200;k++){r+=D[d][0];c+=D[d][1];pts.push([r,c]);if(r<0||c<0||r>=n||c>=n)return{pts,end:[r,c]};const m=grid[r][c];if(m)d=refl(m,d);const key=r+","+c+","+d;if(seen.has(key))return{pts,end:null};seen.add(key)}return{pts,end:null}};
 for(let att=0;att<500;att++){grid=[...Array(n)].map(()=>Array(n).fill(null));r0=Math.floor(Math.random()*n);
  let r=r0,c=-1,d=0,cnt=0,ok=true;for(let k=0;k<60;k++){r+=D[d][0];c+=D[d][1];if(r<0||c<0||r>=n||c>=n)break;if(!grid[r][c]&&Math.random()<.32&&c>0){grid[r][c]=Math.random()<.5?"/":"\\";cnt++}if(grid[r][c])d=refl(grid[r][c],d)}
  const t=trace();if(!t.end||cnt<5||(t.end[1]===-1&&t.end[0]===r0))continue;target=t.end;const onP=new Set(t.pts.map(q=>q.join(",")));
  for(let k=0;k<5;k++){const a=Math.floor(Math.random()*n),q=Math.floor(Math.random()*n);if(!grid[a][q]&&!onP.has(a+","+q))grid[a][q]="/"}
  for(let a=0;a<n;a++)for(let q=0;q<n;q++)if(grid[a][q])grid[a][q]=Math.random()<.5?"/":"\\";
  const t2=trace();if(t2.end&&t2.end[0]===target[0]&&t2.end[1]===target[1])continue;
  break}
 const z=11,off=z;const P=([r,c])=>[off+c*z+z/2,off+r*z+z/2];
 const draw=()=>{const t=trace();const W=(n+2)*z;
  let svg=`<svg viewBox="0 0 ${W} ${W}" width="320" height="320" style="max-width:100%;height:auto;display:block;margin:10px auto;background:#0a2328;border-radius:10px">`;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){svg+=`<rect x="${off+c*z+.5}" y="${off+r*z+.5}" width="${z-1}" height="${z-1}" fill="#123a40" rx="1" data-r="${r}" data-c="${c}" style="cursor:${grid[r][c]?"pointer":"default"}"/>`;const m=grid[r][c];if(m){const x=off+c*z,y=off+r*z;svg+=m==="/"?`<line x1="${x+2}" y1="${y+z-2}" x2="${x+z-2}" y2="${y+2}" stroke="#cfe8e0" stroke-width="1.6" pointer-events="none"/>`:`<line x1="${x+2}" y1="${y+2}" x2="${x+z-2}" y2="${y+z-2}" stroke="#cfe8e0" stroke-width="1.6" pointer-events="none"/>`}}
  svg+=`<polyline points="${t.pts.map(p=>P(p).join(",")).join(" ")}" fill="none" stroke="#ffd166" stroke-width="1.2" opacity=".9"/>`;
  const [sx,sy]=P([r0,-1]);svg+=`<circle cx="${sx}" cy="${sy}" r="3.5" fill="#ffd166"/>`;const [tx,ty]=P(target);svg+=`<circle cx="${tx}" cy="${ty}" r="3.6" fill="none" stroke="#ff6b5a" stroke-width="1.4"/><circle cx="${tx}" cy="${ty}" r="1.4" fill="#ff6b5a"/></svg>`;
  b.innerHTML=head+`<p>Turn the mirrors so the lamp's beam reaches the red seal. Tap a mirror to flip it.</p>${svg}`;
  b.querySelectorAll("rect[data-r]").forEach(x=>x.onclick=()=>{const r=+x.dataset.r,c=+x.dataset.c;if(!grid[r][c])return;grid[r][c]=grid[r][c]==="/"?"\\":"/";const t3=trace();if(t3.end&&t3.end[0]===target[0]&&t3.end[1]===target[1])return done(true);draw()});
  quitRow(b,done)};draw()}
function pSlide(b,head,done){
 let s=[1,2,3,4,5,6,7,8,0];const nb=i=>[i-3,i+3,i%3?i-1:-1,i%3<2?i+1:-1].filter(j=>j>=0&&j<9);
 let last=-1;for(let k=0;k<120;k++){const e=s.indexOf(0);const o=nb(e).filter(j=>j!==last);const j=o[Math.floor(Math.random()*o.length)];[s[e],s[j]]=[s[j],s[e]];last=e}
 if(s.join()==="1,2,3,4,5,6,7,8,0"){s=[1,2,3,4,5,6,0,7,8]}
 const draw=()=>{b.innerHTML=head+`<p>Slide the torn pieces back into order, 1 to 8, gap last.</p><div class="pzgrid" style="grid-template-columns:repeat(3,68px)">${s.map((v,i)=>`<button class="tile ${v?"":"e"}" data-i="${i}" ${v?"":"tabindex=-1"}>${v||""}</button>`).join("")}</div>`;
  b.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>{const i=+x.dataset.i,e=s.indexOf(0);if(nb(e).includes(i)){[s[e],s[i]]=[s[i],s[e]];if(s.join()==="1,2,3,4,5,6,7,8,0")return done(true);draw()}});quitRow(b,done)};draw()}
function pCipher(b,head,done,it){
 const tx=itemText(it);const plain=(tx.cl||tx.body).toUpperCase();
 const k=1+Math.floor(Math.random()*25),st=Math.floor(Math.random()*3);
 const enc=(t,K,S2,dir)=>{let w=0;return t.split("").map(ch=>{if(ch===" "){w++;return ch}const c=ch.charCodeAt(0);if(c<65||c>90)return ch;const sh=((K+S2*w)%26)*dir;return String.fromCharCode((c-65+sh+26*4)%26+65)}).join("")};
 const ct=enc(plain,k,st,1);let a=0,s2=0;
 const draw=()=>{b.innerHTML=head+`<p>Each word is shifted along the alphabet. The first word by the key, and each word after by the step more. Find both.</p><div class="cipher">${enc(ct,a,s2,-1)}</div>
 <div class="dial"><span>Key</span><button id="kd">−</button><b>${a}</b><button id="ku">+</button></div>
 <div class="dial"><span>Step</span><button id="sd">−</button><b>${s2}</b><button id="su">+</button></div>
 <div class="row" style="justify-content:center"><button class="btn" id="ok">This reads true</button></div><p class="meta" id="msg"></p>`;
  b.querySelector("#kd").onclick=()=>{a=(a+25)%26;draw()};b.querySelector("#ku").onclick=()=>{a=(a+1)%26;draw()};
  b.querySelector("#sd").onclick=()=>{s2=(s2+2)%3;draw()};b.querySelector("#su").onclick=()=>{s2=(s2+1)%3;draw()};
  b.querySelector("#ok").onclick=()=>{if(enc(ct,a,s2,-1)===plain)done(true);else b.querySelector("#msg").textContent="Still gibberish."};quitRow(b,done)};draw()}

 el.querySelectorAll("[data-talk]").forEach(x=>x.onclick=()=>talk(x.dataset.talk));
 el.querySelectorAll("[data-pz]").forEach(x=>x.onclick=()=>tryPuzzle(x.dataset.pz));
 el.querySelectorAll("[data-a]").forEach(x=>x.onclick=()=>({search:()=>search(p),glass:truthglass,low:lieLow,sleep,moot:()=>moot(false),bar:()=>rumour("bar",3),kit:()=>rumour("kit",4),oil:buyOil})[x.dataset.a]());
}
function clueCard(it){
 const tx=it.kind==="testimony"?{title:NPC[it.spk].name,body:"",cl:claim(it.prop,null)}:itemText(it);
 const bk={journal:["Journal","b-journal","Always true"],evidence:["Evidence","b-evidence","May be planted"],testimony:["Testimony","b-testimony","True unless the speaker is guilty"],rumour:["Rumour","b-rumour","True about half the time"],secret:["Find","b-find","Relevance unknown"]}[it.kind];
 const v=S.ver[it.id];
 return `<div class="card"><span class="badge ${bk[1]}">${bk[0]}</span><span class="meta">Day ${S.fd[it.id]||"?"} · ${bk[2]}</span>
 ${it.kind==="testimony"?`<p><b>${tx.title}</b> says:</p>`:`<p>${tx.body}</p>`}${tx.cl&&it.kind!=="rumour"?`<p class="claimln">${tx.cl}</p>`:""}
 ${v?`<p class="ver ${v}">${v==="t"?"Truthglass: true":v==="f"?"Truthglass: false":"Truthglass: genuine, but unrelated"}</p>`:""}</div>`}
function renderTabs(){
 const tabs=[["case",`Casebook (${S.clues.length})`],["sus","Suspects"],["sites","Hiding places"],["notes","Notes"],["log","Log"]];
 const tb=document.getElementById("tabs");tb.innerHTML=tabs.map(([k,l])=>`<button class="tab ${TAB===k?"on":""}" data-t="${k}">${l}</button>`).join("");
 tb.querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>{TAB=x.dataset.t;renderTabs()});
 const B=document.getElementById("tabbody");
 if(TAB==="case"){
  const L=S.clues.map(id=>G.items[id]).filter(it=>FILT==="all"||it.kind===FILT).slice().reverse();
  B.innerHTML=`<div class="filters">${[["all","All"],["journal","Journal"],["evidence","Evidence"],["testimony","Testimony"],["rumour","Rumours"],["secret","Finds"]].map(([k,l])=>`<button class="${FILT===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>${L.length?`<div class="cards">${L.map(clueCard).join("")}</div>`:`<p class="meta">Nothing yet. Search places, talk to people, and work the puzzles.</p>`}`;
  B.querySelectorAll("[data-f]").forEach(x=>x.onclick=()=>{FILT=x.dataset.f;renderTabs()})}
 if(TAB==="sus"){
  B.innerHTML=`<div class="cards">${IDS.map(id=>{const n=NPC[id],m=S.marks[id]||"";return`<div class="card sus"><canvas data-por="${id}"></canvas><div><h3>${n.name}</h3><p class="meta">${n.role} · ${PLACES[n.home].n}${gone(id)?" · left the island":""}</p>
   ${S.met[id]?`<p>${Object.keys(CATS).map(k=>`${CATL[k]}: <b>${CATS[k][T[id][k]]}</b>`).join("<br>")}</p>`:`<p class="meta">Not yet met. Talk to them to note their traits.</p>`}
   <p class="meta">Heard ${S.tI[id]||0} of ${G.testi[id].length} statements</p>
   <div class="marks">${[["","Unsure"],["clear","Cleared"],["thief","Thief?"],["look","Lookout?"],["liar","Liar?"]].map(([k,l])=>`<button class="${m===k?"on":""}" data-m="${id}" data-v="${k}">${l}</button>`).join("")}</div></div></div>`}).join("")}</div>`;
  B.querySelectorAll("[data-por]").forEach(c=>portrait(c,NPC[c.dataset.por].look));
  B.querySelectorAll("[data-m]").forEach(x=>x.onclick=()=>{S.marks[x.dataset.m]=x.dataset.v;save();renderTabs()})}
 if(TAB==="sites"){
  const yn=v=>v?"Yes":"No";
  B.innerHTML=`<div class="panel scroll"><table><thead><tr><th>Hiding place</th><th>Where</th><th class="c">Below ground</th><th class="c">Wet</th><th class="c">Holy ground</th><th class="c">In town</th><th>Your mark</th></tr></thead><tbody>${SIDS.map(s=>{const t=SITES[s],m=S.smarks[s]||"";return`<tr><td><b>${t.n}</b></td><td>${PLACES[t.place].n}</td><td class="c">${yn(t.below)}</td><td class="c">${yn(t.wet)}</td><td class="c">${yn(t.holy)}</td><td class="c">${yn(t.town)}</td><td><div class="marks" style="margin:0">${[["","?"],["out","Ruled out"],["lik","Likely"]].map(([k,l])=>`<button class="${m===k?"on":""}" data-s="${s}" data-v="${k}">${l}</button>`).join("")}</div></td></tr>`}).join("")}</tbody></table></div>`;
  B.querySelectorAll("[data-s]").forEach(x=>x.onclick=()=>{S.smarks[x.dataset.s]=x.dataset.v;save();renderTabs()})}
 if(TAB==="notes"){B.innerHTML=`<label class="f" for="nt">Your notes</label><textarea id="nt" placeholder="Who contradicts whom? Which clues still need the Truthglass?">${S.notes.replace(/</g,"&lt;")}</textarea>`;B.querySelector("#nt").oninput=e=>{S.notes=e.target.value;save()}}
 if(TAB==="log"){let last=0;B.innerHTML=`<div class="panel log">${S.log.map(l=>{const h=l.d!==last?`<p class="d">Day ${l.d}</p>`:"";last=l.d;return h+`<p>${SLOTS[Math.min(l.s,3)]}: ${l.t}</p>`}).join("")}</div>`}
}

/* ---------- boot ---------- */
const sv=load();
if(sv&&!sv.over){S=sv;G=gen(S.seed);T=G.T;
 S.fd=S.fd||{};
 render();pos={x:PLACES[S.place].x,y:PLACES[S.place].y};
 modal((b,close)=>{b.innerHTML=`<h2>Welcome back</h2><p>Day ${S.day} of 14. The tide is still rising.</p><div class="row"><button class="btn ghost" id="nw">New mystery</button><button class="btn" id="ct">Continue</button></div>`;b.querySelector("#ct").onclick=close;b.querySelector("#nw").onclick=()=>{close();startGame(Date.now()%1e9)}});
}else startGame(Date.now()%1e9);
}
</script>
</body>
