// ─── Data file sync (File System Access API) ──────────────────────────────────
// The app can connect to a real .json file on disk and auto-save every change.
// The file — not the browser — becomes the source of truth, so moving the
// HTML file around never loses data: just Load the data file again.

// IndexedDB stores the file handle so the connection survives reloads.
// (IDB is origin-bound like localStorage; if it's lost, the data file on disk
// is still intact — the user just re-picks it once.)
function idbOpen(){
  return new Promise((res,rej)=>{
    try{
      const r=indexedDB.open("mindflow-fs",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("kv");
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    }catch(e){ rej(e); }
  });
}
async function idbSet(k,v){ try{ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }catch{} }
async function idbGet(k){ try{ const db=await idbOpen(); return new Promise((res)=>{ const tx=db.transaction("kv","readonly"); const rq=tx.objectStore("kv").get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(undefined); }); }catch{ return undefined; } }
async function idbDel(k){ try{ const db=await idbOpen(); return new Promise((res)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }catch{} }

function buildPayload(){
  const {apiKey,...safeSettings}=S.settings; // API key never leaves localStorage
  return {
    app:"mindflow", version:2, savedAt:Date.now(), savedAtISO:new Date().toISOString(),
    notes:S.notes, events:S.events, sumHist:S.sumHist,
    settings:safeSettings, theme:S.theme,
    rolloverDismissed:lsGet("mf_rollover_dismissed","")
  };
}
function validPayload(o){
  return o && o.app==="mindflow" && Array.isArray(o.notes) && Array.isArray(o.events) && typeof o.sumHist==="object";
}
function applyPayload(obj){
  S.notes=obj.notes; S.events=obj.events; S.sumHist=obj.sumHist||{};
  if(obj.theme) S.theme=Object.assign({},THEME_PRESETS.warm,obj.theme);
  S.settings=Object.assign({},DEFAULT_SETTINGS,obj.settings||{},{apiKey:S.settings.apiKey}); if(!S.settings.model||RETIRED_MODELS.includes(S.settings.model))S.settings.model=DEFAULT_MODEL;
  if(obj.rolloverDismissed!==undefined) lsSet("mf_rollover_dismissed",obj.rolloverDismissed);
  S.viewIdx=0; setDraft=null;
  lsSet("mf_notes",S.notes); lsSet("mf_events",S.events); lsSet("mf_sumhist",S.sumHist);
  lsSet("mf_settings",S.settings); lsSet("mf_theme",S.theme);
  lsSet("mf_meta",{savedAt:obj.savedAt||Date.now()});
  renderAll();
}

async function writeToFile(){
  if(!S.fileHandle) return;
  try{
    const w=await S.fileHandle.createWritable();
    await w.write(JSON.stringify(buildPayload(),null,2));
    await w.close();
    S.lastFileSave=Date.now();
    if(S.fileStatus!=="connected"){ S.fileStatus="connected"; renderFileBanner(); }
    renderSavedIndicator(); flashSaved();
  }catch(e){
    S.fileStatus="error"; renderFileBanner(); renderSavedIndicator();
  }
}
let fileSaveTimer=null;
function scheduleFileSave(){
  if(!S.fileHandle) return;
  clearTimeout(fileSaveTimer);
  fileSaveTimer=setTimeout(writeToFile, 1200); // debounce bursts of edits
}

const FILE_PICKER_OPTS={
  suggestedName:"mindflow-data.json",
  types:[{description:"Mindflow data",accept:{"application/json":[".json"]}}]
};

MF.connectDataFile = async () => {
  if(!("showSaveFilePicker" in window)){ toast("Not supported in this browser — use Export backup"); return; }
  try{
    const handle=await window.showSaveFilePicker(FILE_PICKER_OPTS);
    S.fileHandle=handle; S.fileName=handle.name; S.fileStatus="connected";
    await writeToFile();
    await idbSet("dataFileHandle",handle);
    renderFileBanner(); renderSavedIndicator();
    if(setDraft) renderSettings();
    toast("Data file connected — auto-saving");
  }catch(e){ /* user cancelled picker */ }
};

// Header "Save now" button: behaviour depends on current sync state
MF.headerSave = async () => {
  if(S.fileStatus==="unsupported"){ MF.exportData(); return; }      // no FS API → download a copy
  if(S.fileStatus==="connected"){ clearTimeout(fileSaveTimer); await writeToFile(); toast("Saved to "+S.fileName); return; }
  if(S.fileStatus==="reconnect"){ MF.reconnectFile(); return; }
  if(S.fileStatus==="error"){ await writeToFile(); return; }
  MF.connectDataFile(); // "off" → prompt to choose a file
};

MF.loadDataFile = async () => {
  if(!("showOpenFilePicker" in window)){ toast("Not supported in this browser — use Import backup"); return; }
  try{
    const [handle]=await window.showOpenFilePicker({types:FILE_PICKER_OPTS.types,multiple:false});
    const file=await handle.getFile();
    const obj=JSON.parse(await file.text());
    if(!validPayload(obj)){ toast("Not a valid Mindflow data file"); return; }
    openConfirm(
      "Load this data file? Current notes, events, and summaries in this browser will be replaced by the file's contents, and the file will become the auto-save target.",
      `${obj.notes.length} notes · ${obj.events.length} events · ${Object.keys(obj.sumHist||{}).length} summary day(s)`,
      async ()=>{
        applyPayload(obj);
        S.fileHandle=handle; S.fileName=handle.name; S.fileStatus="connected";
        await idbSet("dataFileHandle",handle);
        renderFileBanner();
        toast("Data loaded — auto-saving to "+handle.name);
      },
      "Load file", ()=>{ if(setDraft) renderSettings(); }
    );
  }catch(e){ /* user cancelled picker */ }
};

MF.disconnectDataFile = async () => {
  clearTimeout(fileSaveTimer);
  S.fileHandle=null; S.fileName=""; S.fileStatus="off";
  await idbDel("dataFileHandle");
  renderFileBanner();
  if(setDraft) renderSettings();
  toast("Data file disconnected (file kept on disk)");
};

MF.retryFileSave = () => writeToFile();

// Startup: try to reconnect to a previously used data file
async function initFileSync(){
  if(!("showSaveFilePicker" in window)) return;
  const handle=await idbGet("dataFileHandle");
  if(!handle) return;
  S.fileHandle=handle; S.fileName=handle.name||"mindflow-data.json";
  let perm="prompt";
  try{ if(handle.queryPermission) perm=await handle.queryPermission({mode:"readwrite"}); }catch{}
  if(perm==="granted"){ await readAndSyncFile(); }
  else { S.fileStatus="reconnect"; renderFileBanner(); }
}
MF.reconnectFile = async () => {
  if(!S.fileHandle) return;
  try{
    let perm="denied";
    if(S.fileHandle.requestPermission) perm=await S.fileHandle.requestPermission({mode:"readwrite"});
    if(perm==="granted"){ await readAndSyncFile(); }
    else { toast("Permission declined — data file not connected"); }
  }catch(e){ S.fileStatus="error"; renderFileBanner(); }
};
// Newer side wins: load the file if it's newer than local, else push local to file
async function readAndSyncFile(){
  try{
    const file=await S.fileHandle.getFile();
    let obj=null;
    try{ obj=JSON.parse(await file.text()); }catch{}
    const localSavedAt=(lsGet("mf_meta",{}).savedAt)||0;
    const fileSavedAt=(obj&&obj.savedAt)||file.lastModified||0;
    S.fileStatus="connected";
    if(validPayload(obj) && fileSavedAt>localSavedAt){
      applyPayload(obj);
      toast("Loaded newer data from "+S.fileName);
    } else {
      await writeToFile();
      if(validPayload(obj)) toast("Data file updated from this browser");
    }
    renderFileBanner();
  }catch(e){ S.fileStatus="error"; renderFileBanner(); }
}

function renderFileBanner(){
  renderSavedIndicator();
  const el=$("file-banner");
  if(!el) return;
  if(S.fileStatus==="reconnect"){
    el.style.display="";
    el.innerHTML=`<span>💾 Your data file <b>${esc(S.fileName)}</b> is ready to reconnect</span>
      <div style="display:flex;gap:6px">
        <button class="btn-primary" style="font-size:11px;padding:3px 10px" onclick="MF.reconnectFile()">Reconnect</button>
        <button class="btn-secondary" style="font-size:11px;padding:3px 10px" onclick="MF.disconnectDataFile()">Ignore</button>
      </div>`;
  } else if(S.fileStatus==="error"){
    el.style.display="";
    el.innerHTML=`<span>⚠ Couldn't save to <b>${esc(S.fileName||"data file")}</b></span>
      <div style="display:flex;gap:6px">
        <button class="btn-primary" style="font-size:11px;padding:3px 10px" onclick="MF.retryFileSave()">Retry</button>
        <button class="btn-secondary" style="font-size:11px;padding:3px 10px" onclick="MF.connectDataFile()">Pick new file</button>
      </div>`;
  } else {
    el.style.display="none"; el.innerHTML="";
  }
}

// ─── Data backup: export / import / clear ─────────────────────────────────────
MF.exportData = () => {
  const payload=buildPayload(); // API key already excluded
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`mindflow-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Backup downloaded");
};
MF.triggerImport = () => $("import-file")?.click();
MF.handleImportFile = el => {
  const f=el.files&&el.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>MF._importText(String(reader.result));
  reader.readAsText(f);
  el.value="";
};
MF._importText = text => {
  let obj;
  try{ obj=JSON.parse(text); }catch{ toast("Invalid backup file"); return; }
  if(!obj||obj.app!=="mindflow"||!Array.isArray(obj.notes)||!Array.isArray(obj.events)||typeof obj.sumHist!=="object"){
    toast("Invalid backup file"); return;
  }
  openConfirm(
    "Importing will REPLACE all current notes, events, and summaries with the backup contents.",
    `${obj.notes.length} notes · ${obj.events.length} events · ${Object.keys(obj.sumHist||{}).length} summary day(s)`,
    ()=>{
      S.notes=obj.notes; S.events=obj.events; S.sumHist=obj.sumHist||{};
      if(obj.theme) S.theme=Object.assign({},THEME_PRESETS.warm,obj.theme);
      // Merge settings but always keep this machine's API key
      S.settings=Object.assign({},DEFAULT_SETTINGS,obj.settings||{},{apiKey:S.settings.apiKey}); if(!S.settings.model||RETIRED_MODELS.includes(S.settings.model))S.settings.model=DEFAULT_MODEL;
      S.viewIdx=0; setDraft=null;
      saveNotes(); saveEvents(); saveSettings(); saveTheme(); lsSet("mf_sumhist",S.sumHist);
      renderAll(); toast("Backup imported");
    },
    "Import", ()=>renderSettings()
  );
};
MF.clearAllData = () => {
  openConfirm(
    "Erase ALL Mindflow data in this browser? Notes, events, summaries, settings, and theme will be permanently deleted."+(S.fileHandle?" Your connected data file on disk will be kept intact and disconnected.":""),
    null,
    async ()=>{
      // Disconnect FIRST so a pending auto-save can't overwrite the file with emptiness
      clearTimeout(fileSaveTimer);
      S.fileHandle=null; S.fileName=""; S.fileStatus=("showSaveFilePicker" in window)?"off":"unsupported";
      await idbDel("dataFileHandle");
      ["mf_notes","mf_events","mf_sumhist","mf_settings","mf_theme","mf_meta","mf_rollover_dismissed"].forEach(k=>{try{localStorage.removeItem(k);}catch{}});
      S.notes=[]; S.events=[]; S.sumHist={};
      S.settings={...DEFAULT_SETTINGS}; S.theme={...THEME_PRESETS.warm};
      S.selDate=todayStr(); S.viewIdx=0; setDraft=null;
      renderFileBanner(); renderAll(); toast("All data erased");
    },
    "Erase everything", ()=>renderSettings()
  );
};

// ─── Copy note ────────────────────────────────────────────────────────────────
MF.copyNote = id => {
  const n=S.notes.find(x=>x.id===id); if(!n)return;
  const done=()=>toast("Copied to clipboard");
  const fallback=()=>{
    const ta=document.createElement("textarea");
    ta.value=n.text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch{ toast("Copy failed"); }
    ta.remove();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(n.text).then(done).catch(fallback);
  } else fallback();
};

// ─── Reminder notifications (fire while app is open) ──────────────────────────
const REMINDER_LEAD = { "10min":10*60e3, "30min":30*60e3, "1hour":3600e3, "1day":86400e3 };
const notifFired = new Set();
function checkReminders(){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const now=Date.now();
  for(const ev of S.events){
    if(!ev.reminder || ev.reminder==="none" || !ev.date) continue;
    const lead=REMINDER_LEAD[ev.reminder]||0;
    // Check today..+2 days so recurring occurrences and 1-day leads are covered
    for(let off=0; off<=2; off++){
      const ds=addDays(todayStr(),off);
      if(!occursOn(ev,ds)) continue;
      const [h,m]=(ev.time||"09:00").split(":").map(Number);
      const dt=parseDateStr(ds); dt.setHours(isNaN(h)?9:h, isNaN(m)?0:m, 0, 0);
      const target=dt.getTime()-lead;
      const key=ev.id+"|"+ds+"|"+ev.reminder;
      if(now>=target && now<target+90e3 && !notifFired.has(key)){
        notifFired.add(key);
        try{
          new Notification("Mindflow · "+ev.title,{
            body:(fmtHHMM(ev.time)||"All day")+(ev.location?" · "+ev.location:"")+(ev.description?"\n"+ev.description:"")
          });
        }catch{}
      }
    }
  }
}

// ─── Keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  const el=document.activeElement||{};
  const tag=el.tagName;
  const typing=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT";
  const overlayOpen=$("overlay-root").innerHTML.length>0;
  const dpOpenNow=!!$("dp-dropdown");

  // Enter/Space activate any role="button" element (accessibility for non-<button> clickables)
  if((e.key==="Enter"||e.key===" ") && el.getAttribute && el.getAttribute("role")==="button"){
    e.preventDefault(); el.click(); return;
  }
  // Escape closes the top overlay or the date picker
  if(e.key==="Escape"){
    if(dpOpenNow){ MF.closeDatePicker(); return; }
    if(overlayOpen){ const bg=$("overlay-root").querySelector(".modal-bg,.pin-bg"); if(bg) bg.click(); return; }
  }

  if(e.key==="/" && !typing && !overlayOpen && !dpOpenNow){ e.preventDefault(); $("search-input").focus(); return; }
  if(typing||overlayOpen||dpOpenNow) return;
  if(e.key==="t"||e.key==="T") MF.goToday();
  else if(e.key==="ArrowLeft") MF.navDate(-1);
  else if(e.key==="ArrowRight") MF.navDate(1);
});

// When a modal/overlay appears, move focus into it (and restore on close)
let lastFocusBeforeOverlay=null;
(new MutationObserver(()=>{
  const root=$("overlay-root"); if(!root) return;
  const hasModal=root.querySelector(".modal, .pin-panel");
  if(hasModal){
    if(!root._focused){
      lastFocusBeforeOverlay=document.activeElement;
      const f=hasModal.querySelector("input:not([type=hidden]),select,textarea,button,[tabindex]");
      if(f) setTimeout(()=>{try{f.focus();}catch{}},10);
      root._focused=true;
    }
  } else {
    root._focused=false;
    if(lastFocusBeforeOverlay){ try{lastFocusBeforeOverlay.focus();}catch{} lastFocusBeforeOverlay=null; }
  }
})).observe($("overlay-root"),{childList:true});

// ─── Init ─────────────────────────────────────────────────────────────────────
renderFilterSel();
saveSumHist(); // prune on startup
renderAll();
checkReminders();
setInterval(checkReminders, 30e3);
initFileSync(); // reconnect to a previously used data file, if any

})();
</script>
